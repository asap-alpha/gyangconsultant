name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SITE_URL: https://gyangcorporateconsult.com
      VITE_CONTACT_ENDPOINT: ${{ vars.VITE_CONTACT_ENDPOINT || '/api/contact.php' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint:check
      - run: npm run test
      - run: npm run build # includes type-check

      # Netlify-only header file and the Vite manifest don't belong on the server
      - run: rm -rf dist/_headers dist/.vite

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          include-hidden-files: true # keep .htaccess
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://gyangcorporateconsult.com
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      # Uploads only files that changed since the last deploy (tracked in .ftp-deploy-sync-state.json on the server)
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
